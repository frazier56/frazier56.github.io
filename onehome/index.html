<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>OneHome - One World Labs</title>
    <link rel="canonical" href="https://app.oneworldlabs.ai/home" />
    <noscript>
      <!-- v101 · This meta refresh used to sit in the <head> unconditionally and race the
           script below on every load — two navigations, one page, and they disagreed: this
           one drops the deep path, the query and the hash, and the script exists to carry
           them. A deep address is somebody following a shared link. Behind <noscript> it
           is a fallback instead of a competitor. -->
      <meta http-equiv="refresh" content="0; url=https://app.oneworldlabs.ai/home" />
    </noscript>
    <script>
      (function () {
        var base = "https://app.oneworldlabs.ai/home";
        var prefix = "home";
        var path = window.location.pathname.replace(/^\/+/, "").replace(/\/index\.html$/, "");
        if (path === prefix) path = "";
        if (path.indexOf(prefix + "/") === 0) path = path.slice(prefix.length + 1);
        var suffix = path ? "/" + path : "";
        window.location.replace(base + suffix + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Opening <a href="https://app.oneworldlabs.ai/home">OneHome</a>.</p>
  </body>
</html>
