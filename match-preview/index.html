*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}

p{margin:0 0 10px;color:var(--mut)}small,.sm{color:var(--mut);font-size:13px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid2{grid-template-columns:1fr}}.grid2 .card{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,var(--act1),var(--act2));color:var(--actx);font:700 16px Inter,sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 2px 10px rgba(36,30,25,.25)}
:root[data-theme=dark] .btn{border-color:rgba(255,255,255,.34)}
.btn.ghost{background:var(--glass);color:var(--tx);border-color:var(--line2);box-shadow:none}.btn.sm2{padding:8px 14px;font-size:14px;border-radius:12px}.btn[disabled]{opacity:.4;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}.bar div{max-width:680px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:5}.tabs div{max-width:680px;margin:0 auto;display:flex;justify-content:space-around}
.tabs button{flex:1;height:48px;border:0;background:transparent;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}.tabs button svg{width:26px;height:26px}.tabs button.on{color:var(--tx)}.tabs button.on::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--hue)}

.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;margin:8px 0;color:var(--tx);cursor:pointer;font:inherit}

.row.on{border-color:var(--state);background:var(--statebg)}.row.on .chk{background:var(--state);border-color:var(--state);box-shadow:inset 0 0 0 4px var(--bg)}
.row.red.on{border-color:var(--warn);background:rgba(161,98,7,.09)}.row.red.on .chk{background:var(--warn);border-color:var(--warn)}
.row.dis{opacity:.4;cursor:not-allowed}.row b{display:block;font-size:16px}.row small{display:block}
.lv{display:flex;gap:6px;margin:-2px 0 8px 34px;flex-wrap:wrap}.lv button{padding:6px 11px;border:1px solid var(--line2);background:var(--glass);color:var(--mut);border-radius:999px;font:13px Inter,sans-serif;cursor:pointer}.lv button.on{border-color:var(--state);color:var(--tx);background:var(--statebg)}
.addrow{display:flex;gap:8px;margin:12px 0}.addrow input{flex:1}
input,select,textarea{background:var(--glass2);border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:12px;font:inherit;width:100%}textarea{resize:vertical;min-height:70px}

.fun{margin:8px 0}.fun .r{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}.fun .b{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.fun .b i{display:block;height:100%;background:var(--hue);min-width:3px;border-radius:99px}

.pt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.pt .st{display:flex;align-items:center;gap:10px}.pt .st button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--glass);color:var(--tx);font-size:20px;cursor:pointer}.pt .st span{min-width:40px;text-align:center;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:6px 0;border:1px solid var(--line2);background:var(--glass);color:var(--tx);border-radius:14px;cursor:pointer;font:inherit}.opt.on{border-color:var(--state);background:var(--statebg)}
.sc5{display:flex;gap:6px;margin-top:8px}.sc5 button{flex:1;height:42px;border:1px solid var(--line2);background:var(--glass);color:var(--tx);border-radius:12px;font:700 15px Inter,sans-serif;cursor:pointer}.sc5 button.on{border-color:var(--state);background:var(--statebg)}.sc5l{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}
.ring{display:block;margin:0 auto}.ringtxt{font:800 34px Inter,sans-serif;fill:var(--tx)}
.band{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;border:1px solid}
.b-excellent{color:var(--ok);border-color:var(--ok)}.b-strong{color:var(--state);border-color:var(--state)}.b-partial{color:var(--warn);border-color:var(--warn)}.b-weak{color:#C2410C;border-color:#C2410C}.b-none{color:var(--bad);border-color:var(--bad)}
.scale{display:flex;gap:4px;margin:8px 0}.scale div{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}.scale div.on{border-color:var(--tx);color:var(--tx);font-weight:700;background:var(--glass2)}
.cat{margin:10px 0}.cat .r{display:flex;justify-content:space-between;font-size:14px}.cat .b{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}.cat .b i{display:block;height:100%;background:var(--hue);border-radius:99px}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0;color:var(--tx)}

.link{display:flex;gap:8px;margin-top:8px}.link input{font-size:13px}
.pack{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:16px;margin:8px 0;background:var(--glass)}

.zh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--tx)}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line2,var(--line));background:var(--glass2);color:var(--tx);font:600 13px/1.2 Inter,sans-serif;cursor:pointer;text-align:left}

.zone.mid{padding:6px;min-height:0}
.srow{display:grid;grid-template-columns:96px 1fr 96px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.stx b{display:block;font-size:15px;color:var(--tx)}.stx small{color:var(--mut);display:block;font-size:12px;line-height:1.3}
.sb{white-space:nowrap;padding:10px 2px;border-radius:12px;border:1.5px solid var(--line2,var(--line));background:var(--glass2);color:var(--tx);font:700 11px/1.1 Inter,sans-serif;cursor:pointer;word-break:normal}

/* dashboard */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{text-align:left;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line2);border-radius:20px;padding:14px;color:var(--tx);cursor:pointer;font-family:Inter,sans-serif;box-shadow:var(--shadow)}
.tile small{color:var(--mut);font-size:12px;display:block}.tile .tv{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 6px}.tile .tv em{font-style:normal;font-size:14px;font-weight:600;color:var(--mut);margin-left:3px;letter-spacing:0}
.tb{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.tb i{display:block;height:100%;background:var(--hue);border-radius:99px}.tile .ts{margin-top:6px;font-weight:600;color:var(--tx)}
.accs{display:grid;gap:10px;align-items:start}
.acc{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.acch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:transparent;border:0;padding:14px 16px;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.acch b{display:block;font-size:16px}.acch small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.acch svg{width:22px;height:22px;flex:0 0 22px;color:var(--mut);transition:transform .2s}.acc.open .acch svg{transform:rotate(180deg)}
.accb{padding:0 16px 16px}
.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eb{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:78px;padding:10px 12px;text-align:left;background:var(--glass2);border:1.5px solid var(--line2);border-radius:14px;color:var(--tx);font:600 14px/1.25 Inter,sans-serif;cursor:pointer}
.eb i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--hue);border:1.5px solid var(--hue);background:transparent}
/* thinking */
.think{text-align:center;margin:40px 0;padding:32px 20px}.think ul{list-style:none;padding:0;margin:16px auto 0;max-width:280px;text-align:left}

@keyframes thin{to{opacity:1;transform:none}}
.spin{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;border:4px solid var(--line);border-top-color:var(--hue);border-right-color:var(--state);animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

 .tile .tv{font-size:42px}
}

const SOC={en:['I am warm and friendly with strangers: clerks, drivers, security.','I stay patient with strangers when things go wrong.','I am just as warm with the people closest to me.','I stay patient with my closest people when things go wrong.','I can say "I was wrong" and "I am sorry" to people close to me.','When I am stressed, I take it out on the people closest to me.','I listen without interrupting when someone shares a problem.','I share my real feelings with the people I trust.','I am comfortable starting a conversation with someone new.','I need a lot of time alone to recharge.','I notice what I am feeling before I react.','When I am angry, I can calm down and talk instead of exploding or going silent.','I can feel what other people feel and show that I do.','I feel real goodwill toward people in general, even ones I do not know.','I feel love or gratitude for nature and the world around me.','I tell the truth even when a lie would be easier or would help me.','I have taken something that was not mine, or kept money I was not owed, and did not give it back.','I keep my promises, including small ones nobody would check.','In the last year I lied to a partner, friend or family member about something that mattered.','When I am wrong, I admit it before I am caught.','When someone lies to me or acts unethically, I address it calmly and directly, without revenge and without pretending it did not happen.','I would not cut a corner or bend a rule to get ahead if it hurt someone else.'],
es:['Soy cálido y amable con desconocidos: cajeros, conductores, guardias.','Mantengo la paciencia con desconocidos cuando algo sale mal.','Soy igual de cálido con las personas más cercanas a mí.','Mantengo la paciencia con mis personas cercanas cuando algo sale mal.','Puedo decir "me equivoqué" y "lo siento" a personas cercanas.','Cuando estoy estresado, lo descargo en las personas más cercanas.','Escucho sin interrumpir cuando alguien comparte un problema.','Comparto lo que siento de verdad con quienes confío.','Me siento cómodo iniciando conversación con alguien nuevo.','Necesito mucho tiempo a solas para recargar.','Noto lo que siento antes de reaccionar.','Cuando estoy enojado, puedo calmarme y hablar en vez de explotar o quedarme callado.','Siento lo que sienten los demás y lo demuestro.','Siento buena voluntad real hacia la gente en general, incluso desconocidos.','Siento amor o gratitud por la naturaleza y el mundo que me rodea.','Digo la verdad aunque una mentira sea más fácil o me convenga.','He tomado algo que no era mío, o me he quedado con dinero que no me correspondía, y no lo devolví.','Cumplo mis promesas, incluso las pequeñas que nadie revisaría.','En el último año le mentí a mi pareja, un amigo o un familiar sobre algo importante.','Cuando me equivoco, lo admito antes de que me descubran.','Cuando alguien me miente o actúa sin ética, lo enfrento con calma y de frente, sin venganza y sin fingir que no pasó.','No tomaría un atajo ni rompería una regla para salir adelante si eso perjudica a otro.']};

function renderMatch(){const P=S.me,code=S.matchCode,inv=db.invites[code];if(!inv)return head()+foot();

    <p class="sm">${t('packTxt')}</p>${payInfo(false)}<div class="addrow"><input id="promo" placeholder="${t('promoPh')}" autocomplete="off"><button class="btn sm2" data-a="promo" data-code="${code}">${t('apply')}</button></div>${S.promoMsg?`<p class="sm" style="color:${S.promoMsg==='promoOk'?'var(--ok)':'var(--bad)'}">${t(S.promoMsg)}</p>`:''}
    <div class="bar"><div><button class="btn ghost" data-a="backm">${t('back')}</button></div></div>`+foot()}
  const kind=inv.kind||'partner';const R=matchScore(P,other,kind);const A=R.A2B,B=R.B2A;const ring=(v)=>{const c=2*Math.PI*54;return `<svg class="ring" width="150" height="150" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="#1B2340" stroke-width="12"/><circle cx="65" cy="65" r="54" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 65 65)"/><defs><linearGradient id="g"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><text x="65" y="74" text-anchor="middle" class="ringtxt">${v}</text></svg>`};
  const bands=['none','weak','partial','strong','excellent'];const ranges={none:'0–39',weak:'40–54',partial:'55–69',strong:'70–84',excellent:'85+'};
  const cats=kind==='partner'?['must','shared','accept','recip','nice']:['shared','accept','recip'];const pv=v=>v==null?null:Math.round(100*v);
  const catRow=c=>{const a=pv(A.c[c]),b=pv(B.c[c]);return `<div class="cat"><div class="r"><span>${t('cat_'+c)}</span><span>${a==null?'–':a} · ${b==null?'–':b}</span></div><div class="b"><i style="width:${a==null?0:a}%"></i></div><div class="b" style="margin-top:3px"><i style="width:${b==null?0:b}%;background:var(--teal)"></i></div></div>`};
  const lvTxt=l=>l?t('lvl'+l):t('lv0');
  const strA=R.ab.strengths.map(x=>`<span class="tag">${esc(traitName(x.id))}</span>`).join('');const strB=R.ba.strengths.map(x=>`<span class="tag">${esc(traitName(x.id))}</span>`).join('');

  const gaps=R.ab.gaps.map(x=>x.id);const gapsB=R.ba.gaps.map(x=>x.id);
  const diffs=R.shared.diffs.map(id=>{const d=DILEMMAS.find(x=>x[0]===id);return S.lang==='es'?d[2]:d[1]});
  const kidsDiff=P.wantsKids&&other.wantsKids&&kidsCompat(P,other)===0;

  diffs.slice(0,2).forEach(s=>qs.push(t('q_diff',{s:esc(s)})));qs.push(t('q_gen'));
  const tips=[];gaps.slice(0,2).forEach(id=>tips.push(t('t_gap',{x:esc(traitName(id)).toLowerCase()})));if(diffs.length)tips.push(t('t_diff'));

  ${(()=>{const a1=socialProfile(P.soc),b1=socialProfile(other.soc);return a1&&b1?`<div class="card"><h3>${t('steadyT')}</h3>${bar(t('eqYou'),a1.steady)}${bar(t('eqThem',{n:nameO}),b1.steady)}<p class="sm">${t('eqNote')}</p></div>`:''})()}<div class="card"><h3>${t('strT')}</h3><p class="sm">${t('youMeet',{n:nameO})}</p>${strA||'<p class="sm">–</p>'}<p class="sm" style="margin-top:8px">${t('theyMeet',{n:nameO})}</p>${strB||'<p class="sm">–</p>'}</div>
  ${gaps.length||gapsB.length?`<div class="card warn"><h3>${t('gapT')}</h3><p class="sm">${t('gapNote')}</p>${gaps.map(id=>`<span class="tag">${esc(traitName(id))}</span>`).join('')}${gapsB.length?`<p class="sm" style="margin-top:8px">${nameO}:</p>${gapsB.map(id=>`<span class="tag">${esc(traitName(id))}</span>`).join('')}`:''}</div>`:''}

  ${(diffs.length||kidsDiff)?`<div class="card warn"><h3>${t('diffT')}</h3><ul>${diffs.map(s=>`<li>${esc(s)}</li>`).join('')}${kidsDiff?`<li>${t('kidsDiff')}</li>`:''}</ul></div>`:''}
