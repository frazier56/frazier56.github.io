<!-- ══════════════════════════════════════════════════════════════════════════════════════
     THIS PAGE MUST NEVER BE DELETED.
     The printed business cards carry a QR code encoding https://www.oneworldlabs.ai/lee/ .
     Ink cannot be redeployed. Every card already handed out, and every card still in the box,
     resolves through here. It redirects to /founder/ and that is all it will ever do.

     Three mechanisms, because any one of them can be defeated:
       · <link rel="canonical">  — tells search engines /founder/ is the real page, so the
         redirect does not compete with its own destination in the index
       · <meta http-equiv="refresh"> — works with JavaScript disabled
       · location.replace()      — instant, and leaves no history entry, so Back from /founder/
         returns to wherever the person actually came from rather than bouncing them round a loop

     17 Oct 2026 — retargeted from /founder/ straight to founder.oneworldlabs.ai. /founder/ is
     itself a 301 to that subdomain, so going through it made the card take THREE hops instead of
     two. Measured on the live site: that middle hop cost about 150 milliseconds of the roughly
     600 the forwarder adds in total.

     The remaining 400 or so is this page being fetched and parsed at all. Only a real 301 can
     remove that, and GitHub Pages cannot serve one — it has to be a Cloudflare Redirect Rule
     (/lee and /lee/ -> https://founder.oneworldlabs.ai/, 301, preserve query string). Cloudflare
     is already in front of this host, so it is one rule in the dashboard, no deploy.
     ══════════════════════════════════════════════════════════════════════════════════════ -->
<link rel="canonical" href="https://founder.oneworldlabs.ai/">
<meta http-equiv="refresh" content="0; url=https://founder.oneworldlabs.ai/">
<meta name="robots" content="noindex, follow">
<script>location.replace("https://founder.oneworldlabs.ai/" + location.search + location.hash);</script>
