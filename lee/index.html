<style>
/* ---- One World look: deep-blue field, frosted glass, action = #782519 ---- */
:root{
  --ink:#EFF4FD; --ink2:rgba(239,244,253,.70); --ink3:rgba(239,244,253,.46);
  --line:rgba(255,255,255,.14);
  --action:#782519; --action-lt:#9A3320; --action-dk:#5E1B12;
  --state:#2FE0CE;
  --frost:blur(34px) saturate(160%);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{overflow-x:clip;max-width:100vw;min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  color:var(--ink);line-height:1.55;
  background:linear-gradient(155deg,#061127 0%,#0A1C3B 34%,#0C244C 66%,#061428 100%);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(18px,5vw,40px) clamp(16px,4.6vw,26px);}

/* two counter-rotating aurora layers — 46s and 58s */
.field{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.field::before,.field::after{content:'';position:absolute;inset:-30%;will-change:transform}
.field::before{background:
  radial-gradient(50% 58% at 82% 6%, rgba(58,132,255,.52), transparent 66%),
  radial-gradient(38% 44% at 99% 40%, rgba(120,175,255,.28), transparent 64%);
  filter:blur(90px);animation:aA 46s ease-in-out infinite alternate}
.field::after{background:
  radial-gradient(56% 54% at 2% 100%, rgba(21,214,196,.30), transparent 66%),
  radial-gradient(40% 38% at 40% 112%, rgba(196,43,134,.16), transparent 62%);
  filter:blur(104px);animation:aB 58s ease-in-out infinite alternate}
@keyframes aA{to{transform:translate3d(3%,-2%,0) rotate(6deg) scale(1.06)}}
@keyframes aB{to{transform:translate3d(-3%,2%,0) rotate(-5deg) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.field::before,.field::after{animation:none}}

.card{width:100%;max-width:440px;border-radius:26px;padding:clamp(22px,6vw,32px);
  position:relative;
  /* first layer is the specular top edge — the line that makes it read as glass */
  background:
    linear-gradient(152deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 46%),
    linear-gradient(152deg,rgba(255,255,255,.07),rgba(255,255,255,.035));
  backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),
             inset 0 -1px 0 rgba(255,255,255,.05),
             0 28px 70px -26px rgba(0,0,0,.75);}
@media(max-width:768px){.card{backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.name{font-size:clamp(28px,7.6vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.role{margin-top:8px;font-size:11.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink2)}
.mark{width:52px;height:52px;flex:0 0 auto;border-radius:14px;object-fit:contain}
.rule{height:2px;width:56px;border-radius:2px;background:var(--action-lt);margin:20px 0 4px}
.org{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:20px}

.rows{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.row{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
  padding:12px 14px;border-radius:14px;min-height:56px;
  background:linear-gradient(152deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  border:1px solid var(--line);transition:border-color .16s,background .16s,transform .12s}
.row:hover{border-color:rgba(47,224,206,.42)}
.row:active{transform:translateY(1px)}
.row:focus-visible{outline:3px solid rgba(47,224,206,.6);outline-offset:2px}
.ic{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;
  background:rgba(255,255,255,.08);border:1px solid var(--line)}
.ic svg{width:17px;height:17px;stroke:var(--state);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.rt{min-width:0}
.rl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink3);line-height:1.5}
.rv{display:block;font-size:16px;font-weight:600;letter-spacing:.012em;overflow-wrap:anywhere}
.rv.num{white-space:nowrap;overflow-wrap:normal}
.cc{color:var(--ink3);font-weight:500}

.save{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;min-height:56px;border-radius:16px;cursor:pointer;
  font:inherit;font-size:16px;font-weight:800;color:#fff;text-decoration:none;
  border:1px solid rgba(255,255,255,.26);
  background:
    linear-gradient(160deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.05) 42%,rgba(255,255,255,0) 62%),
    linear-gradient(140deg,#B0402B 0%,#8C2E1E 55%,#6B2114 100%);
  box-shadow:0 12px 28px -12px rgba(94,27,18,.7);
  transition:filter .14s,transform .12s,box-shadow .14s}
.save:hover{filter:brightness(1.07)}
.save:active{transform:translateY(1px)}
.save:focus-visible{outline:3px solid rgba(47,224,206,.6);outline-offset:2px}
.save svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint{margin-top:11px;text-align:center;font-size:12px;color:var(--ink3)}

.foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:600;
  letter-spacing:.04em}
.foot a:hover{color:var(--state)}
.ticks{display:flex;gap:6px;align-items:flex-end;opacity:.55}
.ticks i{display:block;width:2px;border-radius:1px;background:var(--ink3)}
.ticks i.on{background:var(--state)}
</style>
</head>
