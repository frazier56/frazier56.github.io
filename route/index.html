<style>
:root{--bg:#0B0F1A;--panel:#141B2B;--line:#243046;--ink:#EAF0F8;--dim:#93A3BC;

body{margin:0;background:var(--bg);color:var(--ink);

.row{display:flex;gap:8px;align-items:center}
h1{margin:0;font-size:17px;letter-spacing:-.2px;flex:1}

.loc b{color:var(--teal)}

.empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:14.5px}

.kb{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;

.kb.skip{background:#4A1417;color:#FF8A8A}
.kb.verify{background:#43350E;color:#FFC65C}

.acts .go2{background:#1B2A3D;color:#9CC8FF}
.vf{font-size:11.5px;color:#5FD3B2;font-weight:700;letter-spacing:.03em;margin-top:6px}
.card.isskip{opacity:.5}

.acts .intel{background:#241E3A;border-color:#3A2F5C;color:#C4B5FD}

.sh dl{margin:0}

.sh dd{margin:3px 0 0;font-size:15px;line-height:1.5}

.sh .g{background:#0E1626;border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--dim)}

,"n":"Robert B. Ogletree, Attorney","a":"1640 Lelia Dr Ste 105","c":"Jackson","p":"(601) 345-2900","cat":"Law Firm - General Practice","s":73.0,"r":"","rv":"","v":"Medium","lat":32.33313,"lon":-90.14501,"eta":384,"cl":"2-7","nb":["Jordan Ash, Attorney","Reid Plumbing","William Matthew Burch, Attorney","Kevin Camp, Attorney","Michael Pond / Pond Law Firm","John Hunter Stevens, Attorney","Stevens & Ward P.A. (Lance Stevens)"]},{"d":2,"n":"John Hunter Stevens, Attorney","a":"1535 Lelia Dr","c":"Jackson","p":"(601) 366-1900","cat":"Law Firm - General Practice","s":73.0,"r":"","rv":"","v":"Medium","lat":32.33294,"lon":-90.14737,"eta":390,"cl":"2-7","nb":["Jordan Ash, Attorney","Reid Plumbing","William Matthew Burch, Attorney","Kevin Camp, Attorney","Michael Pond / Pond Law Firm","Robert B. Ogletree, Attorney","Stevens & Ward P.A. (Lance Stevens)"]},{"d":2,"n":"Stevens & Ward P.A. (Lance Stevens)","a":"1855 Lakeland Dr","c":"Jackson","p":"(601) 366-7777","cat":"Law Firm - Personal Injury","s":73.0,"r":"","rv":"","v":"Medium","lat":32.33403,"lon":-90.13911,"eta":398,"cl":"2-7","nb":["Jordan Ash, Attorney","Reid Plumbing","William Matthew Burch, Attorney","Kevin Camp, Attorney","Michael Pond / Pond Law Firm","Robert B. Ogletree, Attorney","John Hunter Stevens, Attorney"]}];
let day=1, mode='near', hideDone=false, me=null, map=null, layer=null;
let query='', cluster=null;
const KBTEXT={skip:'do not drive here',verify:'call before you drive',low:'their site is already good — low value'};

/* Visited stops survive a refresh and a phone going to sleep. If storage is
   unavailable the object below just holds them for the session instead of
   throwing, because losing the tick list mid-afternoon is worse than losing it
   overnight. */
const store={
  k:'owl-flyer-done', mem:{},
  get(){ try{return JSON.parse(localStorage.getItem(this.k)||'{}')}catch(e){return this.mem} },
  set(v){ this.mem=v; try{localStorage.setItem(this.k,JSON.stringify(v))}catch(e){} }
};
let done=store.get();

const mi=(a,b)=>{const R=3958.8,p=Math.PI/180,
  dla=(b[0]-a[0])*p,dlo=(b[1]-a[1])*p,
  h=Math.sin(dla/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));};

const lookUrl=s=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n+' '+s.a+' '+s.c+' MS')}`;
/* Two different questions. Maps answers "are they open and what do the reviews say".
   Web search answers "who are they and what else is out there". Both before driving. */
const webUrl=s=>`https://www.google.com/search?q=${encodeURIComponent(s.n+' '+s.c+' MS')}`;
const dirUrl=(s,travel)=>{
  const dest=encodeURIComponent(s.a+', '+s.c+', MS');
  const from=me?`&origin=${me[0]},${me[1]}`:'';
  return `https://www.google.com/maps/dir/?api=1${from}&destination=${dest}&travelmode=${travel}`;
};

function setMe(lat,lon,how){
  me=[lat,lon];
  document.getElementById('loc').innerHTML=
    'You are at <b>'+lat.toFixed(4)+', '+lon.toFixed(4)+'</b> &middot; '+how;
  draw();
}

document.getElementById('gps').onclick=()=>{
  const el=document.getElementById('loc');
  if(!navigator.geolocation){ el.textContent='This phone will not share location. Tap "I am here" on whichever stop you are standing at.'; return; }
  el.textContent='Finding you\u2026';
  navigator.geolocation.getCurrentPosition(
    p=>setMe(p.coords.latitude,p.coords.longitude,'live'),
    e=>{ el.innerHTML='Location blocked. <b>Tap "I am here"</b> on the stop you are standing at and the list will re-sort around you.'; },
    {enableHighAccuracy:true,timeout:9000,maximumAge:30000});
};

function rows(){
  /* A search or a cluster tap looks across BOTH days on purpose. When Lee types
     a name he wants that business, not "not on today's list". */
  const q=(query||'').trim().toLowerCase();
  let r=(q||cluster)?STOPS.slice():STOPS.filter(s=>s.d===day);
  if(cluster) r=r.filter(s=>s.cl===cluster);
  if(q) r=r.filter(s=>(s.n+' '+s.a+' '+s.c+' '+s.cat).toLowerCase().includes(q));
  if(hideDone) r=r.filter(s=>!done[s.n]);
  if(mode==='near'&&me) r=r.map(s=>({...s,_m:mi(me,[s.lat,s.lon])})).sort((a,b)=>a._m-b._m);
  else r=r.slice().sort((a,b)=>a.eta-b.eta);
  /* The four cut stops stay in the list - Lee should be able to see WHY they were
     cut - but they sink to the bottom so they never sit between two live stops. */
  /* Order within each band is still the drive order. Only the band changes. */
  if(!q&&!cluster){
    const band=x=>x.k==='skip'?2:(x.k==='low'?1:0);
    r=r.slice().sort((a,b)=>band(a)-band(b));
  }
  return r;
}

function draw(){
  const list=document.getElementById('list'), r=rows();
  const banner=cluster?`<div class="cutbar"><button class="clus" id="clrClus">Showing one walkable group — tap to show the whole day</button></div>`:'';
  if(!r.length){ list.innerHTML=banner+'<div class="empty">'+(query?'Nothing matches that.':'Nothing left here. Well done.')+'</div>'; wire(); return; }
  list.innerHTML=r.map(s=>{
    const d=done[s.n]?' done':'';
    const dist=s._m!==undefined?`<span class="tag dist">${s._m.toFixed(1)} mi away</span>`:'';
    const hot=s.s>=70?'<span class="tag hot">high need</span>':'';
    const rev=s.r?`${s.r}\u2605 &middot; ${s.rv} reviews`:'no rating';
    /* The card carries only the FIRST sentence of the warning. The full text is
       three or four sentences long on the bad ones and would bury the list; the
       whole thing is one tap away in the sheet. */
    let short='';
    if(s.i&&s.i.flag){ const dot=s.i.flag.indexOf('. '); short=dot>0?s.i.flag.slice(0,dot+1):s.i.flag; }
    const flag=short?`<div class="flag">${short}</div>`:'';
    const kb=s.k?`<div><span class="kb ${s.k}">${KBTEXT[s.k]}</span></div>`:'';
    const intelBtn=s.i?`<button class="intel" data-intel="${encodeURIComponent(s.n)}">Intel</button>`:'';
    return `<div class="card${d}${s.k==='skip'?' isskip':''}${s.k==='low'?' islow':''}">
      ${kb}${flag}
      <h2>${s.n}</h2>
      <div class="meta">${s.a}, ${s.c} &middot; ${s.cat}</div>
      <div class="meta">${rev}</div>
      ${s.nb&&s.nb.length&&!cluster?`<div><button class="clus" data-clus="${s.cl}">+${s.nb.length} more within a short walk — ${s.nb.slice(0,2).join(', ')}${s.nb.length>2?'…':''}</button></div>`:''}
      <div class="tags">${dist}${hot}${s.i?`<span class="tag pitch">${s.i.pitch.split(' → ')[0]}</span>`:'<span class="tag">no intel yet</span>'}${s.v?`<span class="tag">${s.v} call volume</span>`:''}</div>
      <div class="acts">
        <a class="go" href="${lookUrl(s)}" target="_blank" rel="noopener">Maps</a>
        <a class="go2" href="${webUrl(s)}" target="_blank" rel="noopener">Google</a>
        <a href="${dirUrl(s,'driving')}" target="_blank" rel="noopener">Drive</a>
        <a href="${dirUrl(s,'walking')}" target="_blank" rel="noopener">Walk</a>
        ${s.p?`<a href="tel:${s.p.replace(/[^0-9+]/g,'')}">Call</a>`:''}
        ${intelBtn}
        <button class="here" data-here="${encodeURIComponent(s.n)}">Here</button>
        <button class="tick" data-tick="${encodeURIComponent(s.n)}">${done[s.n]?'Undo':'Done'}</button>
      </div></div>`;
  }).join('');
  list.innerHTML=banner+list.innerHTML;

  list.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{
    const n=decodeURIComponent(b.dataset.tick);
    done[n]?delete done[n]:done[n]=1; store.set(done); draw();
  });
  /* "I am here" is the whole trick: standing at a known stop IS a location fix,
     so the list can re-sort around you with no location permission and no
     mapping API at all. */
  list.querySelectorAll('[data-intel]').forEach(b=>b.onclick=()=>{
    const s=STOPS.find(x=>x.n===decodeURIComponent(b.dataset.intel)); openSheet(s);
  });
  list.querySelectorAll('[data-clus]').forEach(b=>b.onclick=()=>{
    cluster=b.dataset.clus; document.getElementById('q').value=''; query=''; draw();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  list.querySelectorAll('[data-here]').forEach(b=>b.onclick=()=>{
    const n=decodeURIComponent(b.dataset.here), s=STOPS.find(x=>x.n===n);
    setMe(s.lat,s.lon,'set from '+s.n);
  });
  wire();
  if(map) plot(r);
}
function wire(){
  const c=document.getElementById('clrClus');
  if(c) c.onclick=()=>{ cluster=null; draw(); };
}

function openSheet(s){
  const i=s.i, y=v=>v==='yes'?'✓ yes':(v==='no'||String(v).startsWith('no ')?'✗ no':v);
  document.getElementById('shBody').innerHTML=`
    <h3>${s.n}</h3>
    <div class="sub">${s.a}, ${s.c} &middot; ${s.cat}</div>
    ${s.k?`<div><span class="kb ${s.k}">${KBTEXT[s.k]}</span></div>`:''}
    ${i.vf==='loaded'?'<div class="vf">✓ site loaded and checked by hand</div>':''}
    ${i.flag?`<div class="flag">${i.flag}</div>`:''}
    <dl>
      ${i.deep?`<dt>Inside information</dt><dd><div class="say" style="background:#101C2B;color:#BBD9FF">${i.deep}</div></dd>`:''}
      <dt>Say this walking in</dt><dd><div class="say">${i.open||'—'}</div></dd>
      <dt>Ask for</dt><dd>${i.ask}</dd>
      <dt>Sell them, strongest first</dt><dd>${i.pitch}</dd>
      <dd style="color:var(--dim);font-size:14px;margin-top:5px">${i.why}</dd>
      <dt>Where they rank on Google</dt><dd>${i.rank}</dd>
      <dt>Reviews</dt><dd>${s.r?s.r+' stars from '+s.rv+' reviews':'no rating found'}</dd>
      <dt>Established</dt><dd>${i.est}</dd>
      <dt>Website</dt><dd>${i.web}</dd>
      <dd style="color:var(--dim);font-size:14px;margin-top:5px">${i.feel}</dd>
      <dt>What their site is missing</dt>
      <dd><div class="grid">
        <div class="g">Live chat<b>${y(i.chat)}</b></div>
        <div class="g">AI chatbot<b>${y(i.bot)}</b></div>
        <div class="g">Contact form<b>${y(i.form)}</b></div>
        <div class="g">Phone up top<b>${y(i.phone)}</b></div>
        <div class="g">Reviews on page<b>${y(i.revsite)}</b></div>
        <div class="g">Call volume<b>${s.v||'unknown'}</b></div>
      </div></dd>
    </dl>
    <button class="close" id="shClose">Close</button>`;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('shClose').onclick=closeSheet;
  document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}

function plot(r){
  if(layer) layer.remove();
  layer=L.layerGroup().addTo(map);
  r.forEach((s,i)=>L.circleMarker([s.lat,s.lon],{radius:9,weight:2,color:'#0B0F1A',
      fillColor:done[s.n]?'#93A3BC':(s.s>=70?'#F0554B':'#15C2B2'),fillOpacity:1})
    .bindPopup('<b>'+s.n+'</b><br>'+s.a+'<br><a href="'+dirUrl(s,'driving')+'" target="_blank">Directions</a>')
    .addTo(layer));
  if(me) L.circleMarker(me,{radius:11,weight:3,color:'#fff',fillColor:'#E0A21F',fillOpacity:1})
          .bindPopup('You are here').addTo(layer);
  const pts=r.map(s=>[s.lat,s.lon]); if(me) pts.push(me);
  if(pts.length) map.fitBounds(pts,{padding:[35,35]});
}

document.getElementById('toggle').onclick=e=>{
  const m=document.getElementById('map'), open=m.style.display==='block';
  m.style.display=open?'none':'block'; e.target.textContent=open?'Show map':'Hide map';
  if(!open&&!map){ map=L.map('map').setView([32.30,-90.15],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map); }
  if(!open) setTimeout(()=>{map.invalidateSize();draw();},60);
};

const setDay=n=>{day=n;
  document.getElementById('d1').className='pill'+(n===1?' on':'');
  document.getElementById('d2').className='pill'+(n===2?' on':'');
  draw();};
document.getElementById('d1').onclick=()=>setDay(1);
document.getElementById('d2').onclick=()=>setDay(2);

const setMode=m=>{mode=m;
  document.getElementById('mNear').className=m==='near'?'on':'';
  document.getElementById('mPlan').className=m==='plan'?'on':'';
  draw();};
document.getElementById('mNear').onclick=()=>setMode('near');
document.getElementById('mPlan').onclick=()=>setMode('plan');
document.getElementById('mLeft').onclick=e=>{hideDone=!hideDone;
  e.target.className=hideDone?'on':''; e.target.textContent=hideDone?'Showing left':'Hide done'; draw();};

document.getElementById('q').addEventListener('input',e=>{
  query=e.target.value; if(query) cluster=null; draw();
});

draw();
document.getElementById('gps').click();
</script></body></html>
